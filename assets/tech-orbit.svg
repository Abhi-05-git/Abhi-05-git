<svg width="760" height="520" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0b0f1f"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="760" height="520" rx="24" fill="url(#bg)"/>

  <!-- soft depth blobs -->
  <circle cx="120" cy="90" r="90" fill="#3b82f6" opacity="0.18" filter="url(#bigBlur)"/>
  <circle cx="660" cy="440" r="110" fill="#ec4899" opacity="0.15" filter="url(#bigBlur)"/>
  <circle cx="650" cy="80" r="70" fill="#a855f7" opacity="0.15" filter="url(#bigBlur)"/>

  <!-- outer rounded glass border -->
  <rect x="3" y="3" width="754" height="514" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- twinkling stars -->
  <g fill="#e2e8f0">
    <circle cx="70" cy="440" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="380" r="1.6" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="150" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="180" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbit trail rings -->
  <circle cx="380" cy="250" r="120" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 6" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" from="0 380 250" to="360 380 250" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="250" r="185" fill="none" stroke="#f0abfc" stroke-width="1" stroke-dasharray="2 8" opacity="0.25">
    <animateTransform attributeName="transform" type="rotate" from="0 380 250" to="-360 380 250" dur="40s" repeatCount="indefinite"/>
  </circle>

  <!-- center hub with halo pulse -->
  <circle cx="380" cy="250" r="60" fill="url(#hubGrad)" opacity="0.25" filter="url(#softGlow)">
    <animate attributeName="r" values="60;72;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.05;0.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="250" r="48" fill="url(#hubGrad)" filter="url(#softGlow)"/>
  <circle cx="380" cy="250" r="48" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <text x="380" y="259" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0b0f1f" letter-spacing="1">AT</text>

  <!-- inner orbit nodes (pill badges) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 250" to="360 380 250" dur="20s" repeatCount="indefinite"/>
    <g transform="translate(500,250)">
      <rect x="-34" y="-16" width="68" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)"/>
      <text text-anchor="middle" dy="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">React</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 380 250" to="480 380 250" dur="20s" repeatCount="indefinite"/>
    <g transform="translate(500,250)">
      <rect x="-32" y="-16" width="64" height="32" rx="16" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" filter="url(#softGlow)"/>
      <text text-anchor="middle" dy="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#86efac">Node</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 380 250" to="600 380 250" dur="20s" repeatCount="indefinite"/>
    <g transform="translate(500,250)">
      <rect x="-36" y="-16" width="72" height="32" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" filter="url(#softGlow)"/>
      <text text-anchor="middle" dy="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f9a8d4">MongoDB</text>
    </g>
  </g>

  <!-- outer orbit nodes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 250" to="-360 380 250" dur="28s" repeatCount="indefinite"/>
    <g transform="translate(565,250)">
      <rect x="-38" y="-16" width="76" height="32" rx="16" fill="#0f172a" stroke="#facc15" stroke-width="1.5" filter="url(#softGlow)"/>
      <text text-anchor="middle" dy="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde047">Express</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="90 380 250" to="-270 380 250" dur="28s" repeatCount="indefinite"/>
    <g transform="translate(565,250)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" filter="url(#softGlow)"/>
      <text text-anchor="middle" dy="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#67e8f9">Tailwind</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 380 250" to="-180 380 250" dur="28s" repeatCount="indefinite"/>
    <g transform="translate(565,250)">
      <rect x="-30" y="-16" width="60" height="32" rx="16" fill="#0f172a" stroke="#fb923c" stroke-width="1.5" filter="url(#softGlow)"/>
      <text text-anchor="middle" dy="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fdba74">JS</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="270 380 250" to="-90 380 250" dur="28s" repeatCount="indefinite"/>
    <g transform="translate(565,250)">
      <rect x="-32" y="-16" width="64" height="32" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" filter="url(#softGlow)"/>
      <text text-anchor="middle" dy="5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#d8b4fe">PHP</text>
    </g>
  </g>

  <!-- footer identity -->
  <text x="380" y="450" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="800" fill="url(#nameGrad)" letter-spacing="0.5">Abhishek Tripathi</text>
  <text x="380" y="476" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="2">FULL STACK DEVELOPER · MERN</text>

  <!-- underline accent -->
  <rect x="300" y="488" width="160" height="2.5" rx="1.5" fill="url(#nameGrad)" opacity="0.8"/>
</svg>
