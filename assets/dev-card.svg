<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.035"/>
    </pattern>
    <mask id="fadeMask">
      <rect width="800" height="320" fill="url(#maskGrad)"/>
    </mask>
    <radialGradient id="maskGrad" cx="15%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="800" height="320" rx="14" fill="#08080c"/>
  <rect width="800" height="320" rx="14" fill="url(#grid)" mask="url(#fadeMask)"/>

  <!-- hairline border -->
  <rect x="0.75" y="0.75" width="798.5" height="318.5" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- watermark glyph -->
  <text x="640" y="250" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="180" font-weight="700" fill="#ffffff" opacity="0.025">&lt;/&gt;</text>

  <!-- shimmer sweep -->
  <rect width="800" height="320" fill="url(#shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-800 0; 800 0; 800 0" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- status pill -->
  <g transform="translate(48,44)">
    <circle cx="6" cy="0" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="4" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" letter-spacing="1.5" fill="#94a3b8">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- name -->
  <text x="48" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="700" fill="#f8fafc" letter-spacing="-1">Abhishek Tripathi</text>

  <!-- underline draw -->
  <rect x="49" y="162" height="2" rx="1" fill="url(#accentLine)">
    <animate attributeName="width" values="0;220;220;0" keyTimes="0;0.3;0.8;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- role line -->
  <text x="48" y="196" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#a5b4fc" letter-spacing="0.5">Full Stack Web Developer</text>
  <text x="48" y="218" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">Building scalable, user-centric web applications with the MERN stack</text>

  <!-- divider -->
  <line x1="48" y1="248" x2="752" y2="248" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- stack row -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#cbd5e1">
    <text x="48" y="278">React</text>
    <circle cx="90" cy="274" r="2" fill="#475569"/>
    <text x="102" y="278">Node.js</text>
    <circle cx="156" cy="274" r="2" fill="#475569"/>
    <text x="168" y="278">Express</text>
    <circle cx="228" cy="274" r="2" fill="#475569"/>
    <text x="240" y="278">MongoDB</text>
    <circle cx="308" cy="274" r="2" fill="#475569"/>
    <text x="320" y="278">Tailwind CSS</text>
    <circle cx="404" cy="274" r="2" fill="#475569"/>
    <text x="416" y="278">PHP</text>
  </g>

  <!-- corner ticks -->
  <path d="M 48 32 L 48 24 L 56 24" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.6"/>
  <path d="M 752 288 L 752 296 L 744 296" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.6"/>
</svg>
