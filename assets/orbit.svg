<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="500" rx="20" fill="url(#bgGlow)"/>

  <!-- faint starfield dots -->
  <g fill="#94a3b8" opacity="0.3">
    <circle cx="60" cy="70" r="1.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="60" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="430" r="1.2"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="440" r="1.8"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="30" r="1.4"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbit rings -->
  <circle cx="350" cy="250" r="110" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <circle cx="350" cy="250" r="170" fill="none" stroke="#334155" stroke-width="1" opacity="0.35"/>

  <!-- center hub -->
  <circle cx="350" cy="250" r="46" fill="url(#hubGrad)" filter="url(#glow)">
    <animate attributeName="r" values="46;50;46" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="350" y="259" text-anchor="middle" font-family="Fira Code, monospace" font-size="26" font-weight="700" fill="#0f172a">AT</text>

  <!-- inner orbit: 3 nodes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 350 250" to="360 350 250" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(460,250)">
      <circle r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <text text-anchor="middle" dy="6" font-family="Fira Code, monospace" font-size="13" fill="#38bdf8">React</text>
    </g>
    <g transform="translate(240,250)" transform-origin="350 250">
      <animateTransform attributeName="transform" type="rotate" from="0 350 250" to="0 350 250" dur="1s"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 350 250" to="480 350 250" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(460,250)">
      <circle r="26" fill="#1e293b" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
      <text text-anchor="middle" dy="6" font-family="Fira Code, monospace" font-size="12" fill="#22c55e">Node</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 350 250" to="600 350 250" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(460,250)">
      <circle r="26" fill="#1e293b" stroke="#f472b6" stroke-width="2" filter="url(#glow)"/>
      <text text-anchor="middle" dy="6" font-family="Fira Code, monospace" font-size="11" fill="#f472b6">Mongo</text>
    </g>
  </g>

  <!-- outer orbit: 3 nodes, opposite direction -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 350 250" to="-360 350 250" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(520,250)">
      <circle r="24" fill="#1e293b" stroke="#facc15" stroke-width="2" filter="url(#glow)"/>
      <text text-anchor="middle" dy="5" font-family="Fira Code, monospace" font-size="10" fill="#facc15">Express</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="150 350 250" to="-210 350 250" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(520,250)">
      <circle r="24" fill="#1e293b" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
      <text text-anchor="middle" dy="5" font-family="Fira Code, monospace" font-size="9" fill="#22d3ee">Tailwind</text>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="270 350 250" to="-90 350 250" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(520,250)">
      <circle r="24" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
      <text text-anchor="middle" dy="5" font-family="Fira Code, monospace" font-size="10" fill="#f59e0b">JS</text>
    </g>
  </g>

  <!-- name + tagline -->
  <text x="350" y="450" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" font-weight="700" fill="#f1f5f9">Abhishek Tripathi</text>
  <text x="350" y="475" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#94a3b8">MERN Stack · Full Stack Web Developer</text>
</svg>
