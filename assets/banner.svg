<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#0f172a;#1e1b4b" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bgGrad)"/>

  <!-- floating particles -->
  <circle cx="80" cy="60" r="3" fill="#38bdf8" opacity="0.7">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="90" r="4" fill="#a855f7" opacity="0.6">
    <animate attributeName="cy" values="90;115;90" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="200" r="2.5" fill="#22d3ee" opacity="0.6">
    <animate attributeName="cy" values="200;180;200" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="200" r="3.5" fill="#f472b6" opacity="0.5">
    <animate attributeName="cy" values="200;225;200" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- code bracket icon, gently rotating -->
  <g transform="translate(60,130)">
    <text x="0" y="0" font-family="Fira Code, monospace" font-size="46" fill="#38bdf8" opacity="0.8">
      &lt;/&gt;
      <animateTransform attributeName="transform" type="rotate" values="-4 0 -15; 4 0 -15; -4 0 -15" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
  <g transform="translate(770,140)">
    <text x="0" y="0" font-family="Fira Code, monospace" font-size="38" fill="#a855f7" opacity="0.7">
      { }
      <animateTransform attributeName="transform" type="rotate" values="4 0 -15; -4 0 -15; 4 0 -15" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- name with glow pulse -->
  <text x="450" y="120" text-anchor="middle" font-family="Fira Code, monospace" font-size="42" font-weight="700" fill="url(#textGrad)">
    Abhishek Tripathi
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle typing cursor effect -->
  <text x="450" y="160" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" fill="#cbd5e1">
    Full Stack Developer · MERN Stack
    <tspan fill="#38bdf8">|</tspan>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="0s"/>
  </text>

  <!-- animated underline -->
  <rect x="300" y="180" width="0" height="3" fill="url(#textGrad)" rx="2">
    <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.4;0.8;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;300;300;450" keyTimes="0;0.4;0.8;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
